name: Build and deploy the JupyterLite site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned build stack
        run: pip install -r requirements.txt
      - name: Build the site
        # mkdir: git doesn't track empty folders, so a site with no content yet
        # would otherwise have no content/ at checkout
        run: |
          mkdir -p content
          jupyter lite build --contents content --output-dir dist
      - name: Keep the site out of search engines
        run: cp robots.txt dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
